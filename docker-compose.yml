services:
  valkey:
    image: valkey/valkey:latest
    container_name: rag_valkey_queue
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "notice"]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant_vectordb
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  valkey_data:
    driver: local
  qdrant_data:
    driver: local
